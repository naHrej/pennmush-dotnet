name: Auto-Build and Deploy Server Locally

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build PennMUSH Server and Restart
    runs-on: [self-hosted, linux, pennmush-dotnet]

    steps:
      - name: Update local repository
        shell: bash
        run: |
          cd /home/dsantos/deploy/pennmush-dotnet
          git fetch origin main
          git checkout main
          git pull origin main

      - name: Build PennMUSH Server
        shell: bash
        run: |
          dotnet build /home/dsantos/deploy/pennmush-dotnet/PennMUSH.Server/PennMUSH.Server.csproj -c Debug

      - name: Build SpaceEngine Plugin (if present)
        shell: bash
        run: |
          SPACE_PROJ="/home/dsantos/deploy/pennmush-space/PennMUSH.SpaceEngine/PennMUSH.SpaceEngine.csproj"
          if [ -f "$SPACE_PROJ" ]; then
            dotnet build "$SPACE_PROJ" -c Debug
          fi

      - name: Restart PennMUSH Service
        shell: bash
        run: |
          sudo systemctl restart pennmush
          sleep 3
          if HEALTH=$(curl -sf --max-time 5 http://localhost:5119/health); then
            echo "Server started successfully: $HEALTH"
          else
            echo "Service restarted; warming up listener."
          fi
