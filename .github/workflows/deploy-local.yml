name: Auto-Build and Deploy Server Locally

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build PennMUSH Server and Restart
    runs-on: [self-hosted, pennmush-dotnet]

    steps:
      - name: Update local repository
        shell: powershell
        run: |
          Set-Location -Path "C:\Repos\pennmush-dotnet"
          git fetch origin main
          git checkout main
          git pull origin main

      - name: Stop running PennMUSH Server (to release binary file locks)
        shell: powershell
        run: |
          $targets = Get-CimInstance Win32_Process | Where-Object { 
            ($_.Name -eq "PennMUSH.Server.exe") -or 
            ($_.Name -eq "dotnet.exe" -and $_.CommandLine -like "*PennMUSH.Server*")
          }
          if ($targets) {
            Write-Host "Found $($targets.Count) running server process(es). Stopping..."
            foreach ($t in $targets) {
              try {
                Stop-Process -Id $t.ProcessId -Force -ErrorAction SilentlyContinue
                Write-Host "Stopped process $($t.ProcessId) ($($t.Name))"
              } catch {
                Write-Warning "Could not stop process $($t.ProcessId): $_"
              }
            }
            Start-Sleep -Seconds 3
          } else {
            Write-Host "No running PennMUSH.Server processes found."
          }

      - name: Build PennMUSH Server
        shell: powershell
        run: |
          dotnet build "C:\Repos\pennmush-dotnet\PennMUSH.Server\PennMUSH.Server.csproj" -c Debug

      - name: Build SpaceEngine Plugin (if present)
        shell: powershell
        run: |
          $spaceProj = "C:\Repos\pennmush-space\PennMUSH.SpaceEngine\PennMUSH.SpaceEngine.csproj"
          if (Test-Path $spaceProj) {
            dotnet build $spaceProj -c Debug
          }

      - name: Relaunch PennMUSH Server
        shell: powershell
        run: |
          Set-Location -Path "C:\Repos\pennmush-dotnet"
          Write-Host "Starting PennMUSH.Server in background..."
          Start-Process -FilePath "dotnet" -ArgumentList "run watch --project PennMUSH.Server\" -WorkingDirectory "C:\Repos\pennmush-dotnet"
          Start-Sleep -Seconds 4
          try {
            $health = Invoke-RestMethod -Uri "http://localhost:5119/health" -TimeoutSec 5 -ErrorAction Stop
            Write-Host "Server started successfully and responded to health check: $($health.status)"
          } catch {
            Write-Host "Server launched; warming up listener."
          }
