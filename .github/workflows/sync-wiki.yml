name: Sync GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Mirror docs/wiki to GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push docs/wiki pages to GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WIKI_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git ls-remote "${WIKI_URL}" HEAD >/dev/null 2>&1; then
            echo "::notice::GitHub Wiki repository is not initialized yet. Create one stub page in the GitHub Wiki tab, then run the 'Sync GitHub Wiki' workflow manually."
            exit 0
          fi

          rm -rf /tmp/wiki
          git clone "${WIKI_URL}" /tmp/wiki

          find /tmp/wiki -maxdepth 1 -type f -name '*.md' -delete
          cp docs/wiki/*.md /tmp/wiki/

          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if [ -z "$(git status --porcelain)" ]; then
            echo "GitHub Wiki is already up to date."
            exit 0
          fi

          git commit -m "docs: sync wiki from docs/wiki (${GITHUB_SHA::7})"
          git push origin HEAD
